[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ftl-reasons"
version = "0.47.0"
description = "Reasons — automatic belief retraction and dependency-directed backtracking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pyyaml"]
pg = ["psycopg[binary]>=3.1"]
test-pg = ["psycopg[binary]>=3.1", "pytest", "pytest-cov"]
cluster = ["sentence-transformers>=2.2", "scikit-learn>=1.2"]
mcp = ["mcp>=1.0"]
api = ["langchain-anthropic>=0.3"]
vertex = ["langchain-google-vertexai>=2.0"]
langfuse = ["langfuse>=2.0"]
llm = ["langchain-anthropic>=0.3", "langchain-google-vertexai>=2.0", "langfuse>=2.0"]

[project.scripts]
reasons = "reasons_lib.cli:main"
reasons-mcp = "reasons_lib.mcp_server:main"

[tool.setuptools]
packages = ["reasons_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
